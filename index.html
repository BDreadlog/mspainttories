<!DOCTYPE html>
<html>
<head>
    <title>Tory of the Day</title>

    <script>

        const stories = [
            "stories/Kemi B.html"
        ];

        const today = new Date();

        const dayNumber =
            Math.floor(today.getTime() / (1000 * 60 * 60 * 24));

        const selectedStory =
            stories[dayNumber % stories.length];

        window.location.href = selectedStory;

    </script>

</head>

<body>

<h1>Tory of the Day</h1>

<p>Loading today's Tory...</p>

</body>
</html>
